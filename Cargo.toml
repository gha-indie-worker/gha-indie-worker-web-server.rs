    [package]
    name = "gha-indie-worker-web-server"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "MASH web server for GHA Indie Worker"
    repository = "https://github.com/gha-indie-worker/gha-indie-worker-web-server.rs"

    [features]
    default = ["tcp-transport", "nats-transport"]
    tcp-transport = []
    nats-transport = []

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"
    axum = { version = "0.8.9", features = ["ws"] }
    futures-util = "0.3.32"
    gha-indie-worker-lib-core = { git = "https://github.com/gha-indie-worker/gha-indie-worker-lib-core", branch = "main" }
    maud = { version = "0.27.0", features = ["axum"] }
    ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", branch = "main", default-features = false, features = ["axum", "mash", "compression"] }
    rand = "0.10.2"
    tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
    tracing = "0.1.44"
    tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[lints.rust]
unsafe_code = "forbid"




[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
