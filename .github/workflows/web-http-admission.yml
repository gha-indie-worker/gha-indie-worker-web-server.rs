name: web HTTP admission (bounded raw sockets)

on:
  pull_request:
    paths:
      - src/server.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/web-http-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-http-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$EXPECTED_HEAD"
          echo "EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
      - name: Execute bounded HTTP raw-socket tests
        run: cargo test --locked --lib server::tests -- --nocapture
