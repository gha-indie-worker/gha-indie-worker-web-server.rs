name: Web Rust server contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out web candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Emit exact lockfile candidate
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo '---BEGIN-CARGO-LOCK---'
          cat Cargo.lock
          echo '---END-CARGO-LOCK---'
          exit 1
