# flags-2-env surface for `ghaiw-web`
#
# Credential-capable database connection material is intentionally not a public
# flag because argv is observable through process listings and shell history.
# GHA_INDIE_WORKER_DATABASE_URL stays environment/secret-store only until
# flags-2-env supports env-only generated declarations (flags-2-env#29).
[flags.config]
env = "GHA_INDIE_WORKER_CONFIG"
aliases = ["config"]
type = "string"
help = "Path to TOML configuration"

[flags.api_base]
env = "GHA_INDIE_WORKER_API_BASE"
aliases = ["api-base"]
type = "string"
help = "API HTTP base URL"

[flags.json]
env = "GHA_INDIE_WORKER_JSON"
aliases = ["json"]
type = "bool"
help = "Emit JSON"

[flags.gha-indie-worker-api-http-base]
env = "GHA_INDIE_WORKER_API_HTTP_BASE"
aliases = ["gha-indie-worker-api-http-base"]
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_API_HTTP_BASE."

[flags.gha-indie-worker-web-bind]
env = "GHA_INDIE_WORKER_WEB_BIND"
aliases = ["gha-indie-worker-web-bind"]
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_WEB_BIND."
