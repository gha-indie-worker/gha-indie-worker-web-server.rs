# Public flags-2-env surface for `ghaiw-web`.
#
# URL/database configuration remains environment-only because those values may
# contain credentials or other sensitive connection material.

[parse]
allow_unknown = false

[flags.gha-indie-worker-web-bind]
env = "GHA_INDIE_WORKER_WEB_BIND"
long = "gha-indie-worker-web-bind"
type = "string"
help = "HTTP listener binding."
